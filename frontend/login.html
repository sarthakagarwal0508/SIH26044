<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillBridge - Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Centered login screen setup */
        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .login-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .login-card h2 {
            margin-top: 0;
            margin-bottom: 8px;
            color: #1e293b;
            text-align: center;
            font-size: 24px;
        }

        .login-card p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 24px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #334155;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #2563eb;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover {
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h2>SkillBridge Login</h2>
        <p>Academia–Industry Collaboration Portal</p>

        <form id="loginForm" onsubmit="handleLogin(event)">

            <div class="form-group">
                <label>Select Role</label>
                <select id="loginRole" required>
                    <option value="student">🎓 Student</option>
                    <option value="company">🏢 Company / Recruiter</option>
                    <option value="institution">🏛️ Institution Admin</option>
                </select>
            </div>

            <div class="form-group">
                <label>Email / Username</label>
                <input type="text" id="loginUser" placeholder="e.g. bhavishya@akgec.ac.in" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn">
                Login to Portal 🚀
            </button>

            <a href="index.html" class="back-link">← Back to Main Gateway (Switcher)</a>

        </form>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const role = document.getElementById('loginRole').value;
            
            // Role-based redirection logic
            if (role === 'company') {
                window.location.href = 'company.html';
            } else if (role === 'institution') {
                window.location.href = 'institution.html';
            } else {
                window.location.href = 'index.html'; // Default student dashboard
            }
        }
    </script>

</body>

</html>
